# hunk — review-first terminal diff viewer (github.com/modem-dev/hunk)
# Reference: https://www.hunk.dev/docs/reference/config/

# Built-in Catppuccin Mocha — matches Ghostty, lazygit, tuicr, k9s, herdr.
theme = "catppuccin-mocha"

# View: full surface, mouse + keyboard both fully usable.
mode = "auto"        # split on wide panes, stack in narrow herdr splits
sidebar = "auto"     # files pane whenever it fits
cursor_line = "row"
line_numbers = true
wrap_lines = false
hunk_headers = true
menu_bar = true
tab_width = 4

# Agent review workflow: show agent notes on open (`a` toggles).
agent_notes = true

# Dotfiles are the single source of truth — no save-on-quit prompt
# (it would write through the stow symlink into the repo).
prompt_save_view_preferences = false

# Working-tree reviews reload live while the agent keeps writing.
# (`hunk diff` reads [vcs], not [diff] — upstream naming.)
[vcs]
watch = true

# git difftool runs once per file — a one-entry files pane is noise.
[difftool]
sidebar = false

[keybindings]
# Jump logic: [ ] hunk · { } annotated hunk · ( ) annotated file.
"hunk.review.previousAnnotatedFile" = "("
"hunk.review.nextAnnotatedFile" = ")"
# Vim-zz equivalent (single chords only; z itself toggles context).
"hunk.review.alignCurrentLineCenter" = "Z"
