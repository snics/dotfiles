# herdr — terminal workspace manager for AI coding agents
# Docs: https://herdr.dev/docs/configuration/
# Full option reference: `herdr --default-config`
# Apply changes to a running server: `herdr server reload-config`

# Skip first-run notification onboarding (toast delivery is configured below).
onboarding = false

[theme]
# Catppuccin Mocha — matches Ghostty, lazygit, and the rest of the stack.
name = "catppuccin"

# Token overrides on top of the base theme. Available tokens: accent,
# panel_bg, surface0, surface1, surface_dim, overlay0, overlay1, text,
# subtext0, mauve, green, yellow, red, blue, teal, peach.
[theme.custom]
# Unfocused pane borders and divider lines — the Catppuccin default is too
# dark to see; use Nord's polar-night gray-blue (nord3) instead.
surface_dim = "#4c566a"

# Let the terminal background show through the herdr chrome (tab bar,
# sidebar) so it picks up Ghostty's translucent/blurred glass look instead
# of rendering opaque #1e1e2e blocks.
panel_bg = "reset"

# Run `herdr --default-config` to see all bindable actions.

[keys]
# ctrl+b (tmux default). We wanted ctrl+space (old tmux muscle memory) but it
# is unusable on macOS + Ghostty: even with the input-source switcher disabled
# and after a reboot, ctrl+space never reaches Ghostty (macOS text-input claims
# it; Ghostty #3403) — it can't even be bound to a native Ghostty action.
# Trade-off: ctrl+b shadows nvim's ctrl+b (nvim-cmp scroll-docs + smooth
# page-up), which are rebound on the nvim side to keep them reachable.
prefix = "ctrl+b"
# Direct workspace switching like browser tabs, no prefix needed — the
# cmd+1..9 mapping lives in [keys.indexed] below (a bare "cmd+1..9" here is
# invalid and would discard the whole [keys] block). Ghostty's default
# cmd+1..9 goto_tab bindings are unbound to let these through (see ghostty).

# House convention |/- for splits (tmux, Ghostty); frees prefix+v for the
# scrollback editor (mirrors tmux prefix+v = copy mode).
split_vertical = "prefix+|"
edit_scrollback = "prefix+v"

# tmux muscle memory: prefix+z toggles the focused pane to fullscreen (zoom)
# and back. (Zed moved to prefix+shift+e to free this.)
zoom = "prefix+z"

# macOS convention (cmd+,) — frees prefix+s for the future btop launcher.
settings = "prefix+comma"

# tmux-style jump back to the previous pane.
last_pane = "prefix+;"

# Bracket navigation like [b/]b in NeoVim.
previous_workspace = "prefix+["
next_workspace = "prefix+]"

# a = agent: step through the attention queue (agent_panel_sort = priority).
next_agent = "prefix+a"
previous_agent = "prefix+shift+a"

# Mirror of cmd+1..9 workspaces — shift = one level deeper.
# The cmd+shift+1..9 mapping lives in [keys.indexed] below.

# o = open; counterpart to prefix+shift+g (worktree picker).
open_worktree = "prefix+shift+o"

# Built-in worktree prompt unbound — prefix+shift+g runs the sessionizer
# worktree picker instead (branch selection, layouts).
new_worktree = ""

# goto fuzzy picker (floating overlay) on its herdr default — lazygit no
# longer shadows it here; the overlay lives on cmd+g (plugin layer).
goto = "prefix+g"

# Prefix+hjkl pane focus is redundant with the direct ctrl+hjkl navigation;
# freeing k for the k9s launcher (and h/j/l for symmetry).
focus_pane_left = ""
focus_pane_down = ""
focus_pane_up = ""
focus_pane_right = ""

# Direct (prefix-less) indexed shortcuts: a modifier string maps <mod>+1..9.
# cmd+1..9 → switch workspace; cmd+shift+1..9 → focus agent row. These MUST
# live here — putting a range like "cmd+1..9" in a [keys] field above makes
# herdr silently discard the entire [keys] block (no error, just dead keys).
[keys.indexed]
workspaces = "cmd"
agents = "cmd+shift"

[worktrees]
# Central, visible worktree location next to the projects (instead of the
# hidden ~/.herdr/worktrees default) — reachable for zoxide/yazi/fzf.
directory = "~/Projects/_worktrees"

# Seamless Ctrl+h/j/k/l navigation and Alt+Shift+h/j/k/l resizing between
# herdr panes and NeoVim splits. Plugin: lmilojevicc/herdr-splits.nvim (nvim
# side lives in nvim/lua/plugins/herdr-splits.lua). Alt chords require
# macos-option-as-alt in Ghostty. Resize sits on Alt+Shift so plain Alt+j/k
# stays free for NeoVim's move-line mappings.
[[keys.command]]
key = "ctrl+h"
type = "plugin_action"
command = "herdr-splits.nav-left"
description = "Navigate pane left (Neovim-aware)"

[[keys.command]]
key = "ctrl+j"
type = "plugin_action"
command = "herdr-splits.nav-down"
description = "Navigate pane down (Neovim-aware)"

[[keys.command]]
key = "ctrl+k"
type = "plugin_action"
command = "herdr-splits.nav-up"
description = "Navigate pane up (Neovim-aware)"

[[keys.command]]
key = "ctrl+l"
type = "plugin_action"
command = "herdr-splits.nav-right"
description = "Navigate pane right (Neovim-aware)"

[[keys.command]]
key = "alt+shift+h"
type = "plugin_action"
command = "herdr-splits.resize-left"
description = "Resize pane left"

[[keys.command]]
key = "alt+shift+j"
type = "plugin_action"
command = "herdr-splits.resize-down"
description = "Resize pane down"

[[keys.command]]
key = "alt+shift+k"
type = "plugin_action"
command = "herdr-splits.resize-up"
description = "Resize pane up"

[[keys.command]]
key = "alt+shift+l"
type = "plugin_action"
command = "herdr-splits.resize-right"
description = "Resize pane right"

# Toggle the reviewr code-review sidebar (persiyanov/herdr-reviewr).
# It also auto-opens for newly created worktree workspaces.
[[keys.command]]
key = "cmd+r"
type = "plugin_action"
command = "persiyanov.reviewr.toggle"
description = "Toggle reviewr code-review sidebar"

# R = deep review: tuicr popup over the whole branch diff (merge-base against
# the same base list as reviewr, incl. uncommitted) — complement to the cmd+r
# sidebar for pre-commit/PR passes. Plain popup like lazygit: inherits the
# focused pane's cwd (worktree-correct). Quitting tuicr (q) closes the popup.
[[keys.command]]
key = "cmd+shift+r"
type = "popup"
command = "tuicr-branch"
width = "90%"
height = "90%"
description = "tuicr branch review"

# Live token spend dashboard (Davidcreador/herdr-token-dashboard).
# Note: currently reads Pi and OpenCode sessions only.
[[keys.command]]
key = "prefix+$"
type = "plugin_action"
command = "dave.token-dashboard.open-dashboard"
description = "Token spend dashboard"

# u = URL: scan the panes for URLs, pick one with fzf.
# Bind the PANE entrypoint (url-picker), NOT the pick-url ACTION: the action runs
# fzf headless (no visible terminal) and just hangs. Opening the plugin's overlay
# pane gives fzf a real terminal. See x0d7x/herdr-fzf-url README.
[[keys.command]]
key = "prefix+u"
type = "shell"
command = "herdr plugin pane open --plugin url.fzf-picker --entrypoint url-picker"
description = "Pick a URL from the panes (fzf)"

# g = git on the cmd layer (consistent with cmd+r reviewr); the only lazygit
# binding — prefix+g is the built-in goto fuzzy picker. Plain popup instead
# of the lazygit-overlay plugin: popups inherit the focused pane's cwd
# (worktree-correct), which was the plugin's whole job.
[[keys.command]]
key = "cmd+g"
type = "popup"
command = "lazygit"
width = "90%"
height = "90%"
description = "lazygit"

# o = overview: git-aware read-only file viewer beside the agent
# (smarzban/herdr-file-viewer). cmd+f would shadow Ghostty's search.
[[keys.command]]
key = "cmd+o"
type = "plugin_action"
command = "herdr-file-viewer.open-file-viewer"
description = "File viewer (git-aware)"

[[keys.command]]
key = "cmd+shift+o"
type = "plugin_action"
command = "herdr-file-viewer.open-file-viewer-tab"
description = "File viewer in a new tab"

# p = projects: fuzzy-pick any repo under the project roots (sessionizer)
# — existing workspaces focus, new ones get the configured layout.
# herdr-plus' curated template browser stays reachable via the action menu.
[[keys.command]]
key = "cmd+p"
type = "plugin_action"
command = "sessionizer.open"
description = "Project / session picker"

# Worktree flow with branch picker (local/remote/new) — replaces the
# built-in new_worktree prompt on the same key.
[[keys.command]]
key = "prefix+shift+g"
type = "plugin_action"
command = "sessionizer.worktree-open"
description = "Worktree picker (branch-aware)"

# Quick actions: fuzzy one-off scripts, run in the current directory
# (mirrors <leader>. scratch semantics in nvim).
[[keys.command]]
key = "prefix+."
type = "plugin_action"
command = "cloudmanic.herdr-plus.quick-actions"
description = "Quick actions"

# y = yank: tmux-fingers style copy hints. Overlays short labels on visible
# tokens (URLs, paths, git hashes, IDs); type a label to copy it to the
# clipboard (Tab = multi-select). The .open action opens the overlay pane
# itself, so a plain plugin_action binding works (no headless fzf hang).
# Install: herdr plugin install hotchpotch/herdr-tiny-fingers (just herdr-plugins).
[[keys.command]]
key = "prefix+y"
type = "plugin_action"
command = "hotchpotch.herdr-tiny-fingers.open"
description = "Copy-hints (fingers) — yank a token to the clipboard"

# Popup launchers — tmux display-popup muscle memory (same prefix, same
# letters): f=files, s=system, k=kubernetes, t=terminal (g=git lives on
# cmd+g; prefix+g is the goto picker). type=popup floats a session-modal
# terminal over the layout and closes it when the tool exits. Popups swallow
# ALL input incl. Esc until exit — herdr's own keybindings do NOT fire while
# a popup has focus (user-tested; a cmd+esc → socket popup.close binding was
# tried and removed), so the uniform close key is ctrl+c IN the tools:
# yazi (default close-tab-or-quit), btop/k9s (native), scratch shell (TRAPINT
# in zsh/conf.d/50-keybindings.zsh, empty line only). The popup border label
# is hard-coded ("popup") — OSC terminal titles are ignored, verified 0.7.5.
[[keys.command]]
key = "prefix+f"
type = "popup"
command = "yazi"
width = "85%"
height = "85%"
description = "yazi file manager"

[[keys.command]]
key = "prefix+s"
type = "popup"
command = "btop"
width = "85%"
height = "85%"
description = "btop system monitor"

[[keys.command]]
key = "prefix+k"
type = "popup"
command = "k9s"
width = "90%"
height = "90%"
description = "k9s kubernetes TUI"

# t = terminal: scratch shell popup for quick one-off commands without
# touching the tab layout (the tmux scratch popup we never replaced).
# Login shell to match herdr's macOS shell_mode = "auto" convention;
# HERDR_POPUP=1 arms the Esc-to-close zsh widget.
[[keys.command]]
key = "prefix+t"
type = "popup"
command = "HERDR_POPUP=1 zsh -l"
width = "75%"
height = "70%"
description = "Scratch terminal"

# shift+s = session manager: herdrctx in a popup for an overview of all herdr
# sessions (create/stop/delete work). Caveat: attaching (Enter/a) can NOT work
# from inside a popup — nested herdr is disabled and clients can't switch
# sessions in place; attach via a detached window (prefix+q) as before.
[[keys.command]]
key = "prefix+shift+s"
type = "popup"
command = "herdrctx"
width = "70%"
height = "70%"
description = "Session manager (herdrctx)"

# e = edit: open NeoVim in a temporary pane at the current dir (TUI, stays until
# you :q). Deliberately type=pane, not popup — editing next to the agent is a
# side-by-side activity, not a quick visit.
[[keys.command]]
key = "prefix+e"
type = "pane"
command = "nvim"
description = "NeoVim (editor)"

# shift+e = the GUI editor sibling of prefix+e (nvim): open the current dir in
# Zed. type=shell launches it detached (windowed app, not a terminal program).
# (prefix+z is tmux pane-zoom.)
[[keys.command]]
key = "prefix+shift+e"
type = "shell"
command = "zed ."
description = "Open current dir in Zed (GUI)"

[ui]
# Draw borders around split panes and keep them visually separated
# with gaps instead of shared divider lines.
pane_borders = true
pane_gaps = true

# Catppuccin Mocha blue for borders, highlights, and navigation UI.
accent = "#89b4fa"

show_agent_labels_on_pane_borders = true

# Collapsing the sidebar (prefix+b) hides it entirely instead of leaving
# a compact icon rail.
sidebar_collapsed_mode = "hidden"

# Hide the tab row while a workspace has only one tab — most workspaces
# do, so the top bar disappears entirely until a second tab exists.
hide_tab_bar_when_single_tab = true

# Create tabs immediately with generated names instead of prompting —
# the renamer plugin re-titles workspaces from the agent's first prompt.
prompt_new_tab_name = false

# Sort the agents panel as an attention queue (blocked first) instead of
# grouping by space.
agent_panel_sort = "spaces"
[ui.toast]
# Native macOS notifications for agent activity in background workspaces.
delivery = "system"

[ui.toast.herdr]
position = "bottom-right"

# macOS delivered its notifications silently (per-app sound toggle off), so let
# herdr play its own chime for background agent state changes instead.
[ui.sound]
enabled = true

[experimental]
# Kitty graphics passthrough — Ghostty speaks the protocol, so panes can
# render real images (yazi previews, imgcat, etc.).
kitty_graphics = true
# Keep recent pane screen history across full server restarts.
pane_history = true
