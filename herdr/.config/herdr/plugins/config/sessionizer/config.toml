# sessionizer — fuzzy project/worktree picker over the project roots.
# Docs: https://github.com/andrewchng/herdr-sessionizer
# Roots use globs, so client/category folders are discovered dynamically —
# no per-project files and no client names tracked in the repo.

[projects]
# Recursive globs: clients nest 2-3 levels deep, Startups holds several
# orgs (DevNinjas, DataMedis, Avoplan). If cmd+p ever feels slow, narrow
# these back to explicit org folders.
roots = [
  "~/Projects/Clients/**",
  "~/Projects/GitHub",
  "~/Projects/Startups/**",
  "~/Projects/Talks",
  "~/Projects/Workshop",
]
git_only = true
depth = 1

# Layout applied when a NEW workspace is created (existing ones are only
# focused): agent in the first tab, lazygit and a plain shell behind it.
[layout]
focus = "agent"

[tabs.agent]
label = "claude"

[[tabs.agent.panes]]
id = "agent"
title = "claude"
command = "claude"

[tabs.git]
label = "lazygit"

[[tabs.git.panes]]
id = "git"
title = "lazygit"
command = "lazygit"

[tabs.term]
label = "terminal"

[[tabs.term.panes]]
id = "term"
title = "shell"
