plugins:
  # ── YAML / Blame ──────────────────────
  blame:
    shortCut: b
    confirm: false
    description: "Blame"
    scopes:
      - all
    command: sh
    background: false
    args:
      - -c
      - "kubectl-blame $RESOURCE_NAME $NAME -n $NAMESPACE --context $CONTEXT | less"

  # ── Debugging ─────────────────────────
  debug:
    shortCut: Shift-D
    description: Add debug container
    dangerous: true
    scopes:
      - containers
    command: bash
    background: false
    confirm: true
    args:
      - -c
      - "kubectl debug -it --context $CONTEXT -n=$NAMESPACE $POD --target=$NAME --image=nicolaka/netshoot:v0.12 --share-processes -- zsh"

  # ── Image Scanning ────────────────────
  dive:
    shortCut: d
    confirm: true
    description: "Dive image"
    scopes:
      - containers
    command: dive
    background: false
    args:
      - $COL-IMAGE

  # ── Logs ──────────────────────────────
  raw-logs-follow:
    shortCut: Ctrl-L
    description: logs -f
    scopes:
      - pods
    command: kubectl
    background: false
    args:
      - logs
      - -f
      - $NAME
      - -n
      - $NAMESPACE
      - --context
      - $CONTEXT
      - --kubeconfig
      - $KUBECONFIG

  log-less:
    shortCut: Shift-L
    description: "logs|less"
    scopes:
      - pods
    command: bash
    background: false
    args:
      - -c
      - '"$@" | less'
      - dummy-arg
      - kubectl
      - logs
      - $NAME
      - -n
      - $NAMESPACE
      - --context
      - $CONTEXT
      - --kubeconfig
      - $KUBECONFIG

  stern:
    shortCut: Shift-T
    confirm: false
    description: "Logs (stern)"
    scopes:
      - pods
    command: stern
    background: false
    args:
      - --tail
      - "50"
      - $FILTER
      - -n
      - $NAMESPACE
      - --context
      - $CONTEXT

  # ── Helm ──────────────────────────────
  helm-default-values:
    shortCut: Shift-V
    confirm: false
    description: Chart Default Values
    scopes:
      - helm
    command: sh
    background: false
    args:
      - -c
      - >-
        revision=$(helm history -n $NAMESPACE --kube-context $CONTEXT $COL-NAME | grep deployed | cut -d$'\t' -f1 | tr -d ' \t');
        kubectl
        get secrets
        --context $CONTEXT
        -n $NAMESPACE
        sh.helm.release.v1.$COL-NAME.v$revision -o yaml
        | yq e '.data.release' -
        | base64 -d
        | base64 -d
        | gunzip
        | jq -r '.chart.values'
        | yq -P
        | less -K

  helm-values:
    shortCut: v
    confirm: false
    description: Values
    scopes:
      - helm
    command: sh
    background: false
    args:
      - -c
      - "helm get values $COL-NAME -n $NAMESPACE --kube-context $CONTEXT | less -K"

  # ── Resource Recommendations ──────────
  # Requires Prometheus + Robusta KRR (https://github.com/robusta-dev/krr)
  krr:
    shortCut: Shift-K
    description: Get krr
    scopes:
      - deployments
      - daemonsets
      - statefulsets
    command: bash
    background: false
    confirm: false
    args:
      - -c
      - |
        LABELS=$(kubectl get $RESOURCE_NAME $NAME -n $NAMESPACE --context $CONTEXT --show-labels | awk '{print $NF}' | awk '{if(NR>1)print}')
        krr simple --cluster $CONTEXT --selector $LABELS
        echo "Press 'q' to exit"
        while : ; do
        read -n 1 k <&1
        if [[ $k = q ]] ; then
        break
        fi
        done

  # ── Events ────────────────────────────
  watch-events:
    shortCut: Shift-E
    confirm: false
    description: Get Events
    scopes:
      - all
    command: sh
    background: false
    args:
      - -c
      - "watch -n 5 kubectl get events --context $CONTEXT --namespace $NAMESPACE --field-selector involvedObject.name=$NAME"

  # ── Cert Manager ──────────────────────
  cert-status:
    shortCut: Shift-S
    confirm: false
    description: Certificate status
    scopes:
      - certificates
    command: bash
    background: false
    args:
      - -c
      - "cmctl status certificate --context $CONTEXT -n $NAMESPACE $NAME |& less"

  cert-renew:
    shortCut: Shift-R
    confirm: false
    description: Certificate renew
    scopes:
      - certificates
    command: bash
    background: false
    args:
      - -c
      - "cmctl renew --context $CONTEXT -n $NAMESPACE $NAME |& less"

  secret-inspect:
    shortCut: Shift-I
    confirm: false
    description: Inspect secret
    scopes:
      - secrets
    command: bash
    background: false
    args:
      - -c
      - "cmctl inspect secret --context $CONTEXT -n $NAMESPACE $NAME |& less"

  # ── AI Troubleshooting (HolmesGPT) ───
  # Requires: brew install robusta-dev/holmesgpt/holmesgpt
  holmesgpt:
    shortCut: Shift-H
    description: Ask HolmesGPT
    scopes:
      - all
    command: bash
    background: false
    confirm: false
    args:
      - -c
      - |
        holmes ask "why is $NAME of $RESOURCE_NAME in -n $NAMESPACE not working as expected"
        echo "Press 'q' to exit"
        while : ; do
        read -n 1 k <&1
        if [[ $k = q ]] ; then
        break
        fi
        done

  custom-holmesgpt:
    shortCut: Shift-Q
    description: Custom HolmesGPT Ask
    scopes:
      - all
    command: bash
    background: false
    confirm: false
    args:
      - -c
      - |
        INSTRUCTIONS="# Edit the line below. Lines starting with '#' will be ignored."
        DEFAULT_ASK_COMMAND="why is $NAME of $RESOURCE_NAME in -n $NAMESPACE not working as expected"
        QUESTION_FILE=$(mktemp)
        echo "$INSTRUCTIONS" > "$QUESTION_FILE"
        echo "$DEFAULT_ASK_COMMAND" >> "$QUESTION_FILE"
        ${EDITOR:-nvim} "$QUESTION_FILE"
        user_input=$(grep -v '^#' "$QUESTION_FILE")
        echo running: holmes ask "\"$user_input\""
        holmes ask "$user_input"
        echo "Press 'q' to exit"
        while : ; do
        read -n 1 k <&1
        if [[ $k = q ]] ; then
        break
        fi
        done

  # ── CRD Wizard ────────────────────────
  # Requires: kubectl krew install crd-wizard
  crd-wizard:
    shortCut: Shift-W
    confirm: false
    description: CRD Wizard TUI
    scopes:
      - crd
    command: kubectl
    background: false
    args:
      - crd-wizard
      - tui
      - --context
      - $CONTEXT

  crd-wizard-ai:
    shortCut: Shift-A
    confirm: false
    description: CRD Wizard TUI (AI)
    scopes:
      - crd
    command: bash
    background: false
    args:
      - -c
      - "kubectl crd-wizard tui --context $CONTEXT --enable-ai --ai-provider gemini --gemini-api-key $GOOGLE_API_KEY"

  crd-wizard-web:
    shortCut: Shift-X
    confirm: false
    description: CRD Wizard Web UI
    scopes:
      - crd
    command: kubectl
    background: true
    args:
      - crd-wizard
      - web
      - --context
      - $CONTEXT

  # ── Flux (GitOps) ─────────────────────
  # Source: https://github.com/derailed/k9s/blob/master/plugins/flux.yaml
  # Shift-T (confirm) toggle suspend/resume; Shift-R reconcile; Shift-F trace.
  # flux-operator-scoped plugins (rset/inputprovider/fluxinstance) require the
  # flux-operator CLI (https://fluxcd.control-plane.io/operator/).
  toggle-helmrelease:
    shortCut: Shift-T
    confirm: true
    scopes:
      - helmreleases
    description: Toggle to suspend or resume a HelmRelease
    command: bash
    background: false
    args:
      - -c
      - >-
        suspended=$(kubectl --context $CONTEXT get helmreleases -n $NAMESPACE $NAME -o=custom-columns=TYPE:.spec.suspend | tail -1);
        verb=$([ $suspended = "true" ] && echo "resume" || echo "suspend");
        flux
        $verb helmrelease
        --context $CONTEXT
        -n $NAMESPACE $NAME
        | less -K
  toggle-kustomization:
    shortCut: Shift-T
    confirm: true
    scopes:
      - kustomizations
    description: Toggle to suspend or resume a Kustomization
    command: bash
    background: false
    args:
      - -c
      - >-
        suspended=$(kubectl --context $CONTEXT get kustomizations -n $NAMESPACE $NAME -o=custom-columns=TYPE:.spec.suspend | tail -1);
        verb=$([ $suspended = "true" ] && echo "resume" || echo "suspend");
        flux
        $verb kustomization
        --context $CONTEXT
        -n $NAMESPACE $NAME
        | less -K
  reconcile-git:
    shortCut: Shift-R
    confirm: false
    description: Flux reconcile
    scopes:
      - gitrepositories
    command: bash
    background: false
    args:
      - -c
      - >-
        flux
        reconcile source git
        --context $CONTEXT
        -n $NAMESPACE $NAME
        | less -K
  reconcile-hr:
    shortCut: Shift-R
    confirm: false
    description: Flux reconcile
    scopes:
      - helmreleases
    command: bash
    background: false
    args:
      - -c
      - >-
        flux
        reconcile helmrelease
        --context $CONTEXT
        -n $NAMESPACE $NAME
        | less -K
  reconcile-helm-repo:
    shortCut: Shift-Z
    description: Flux reconcile
    scopes:
      - helmrepositories
    command: bash
    background: false
    confirm: false
    args:
      - -c
      - >-
        flux
        reconcile source helm
        --context $CONTEXT
        -n $NAMESPACE $NAME
        | less -K
  reconcile-oci-repo:
    shortCut: Shift-Z
    description: Flux reconcile
    scopes:
      - ocirepositories
    command: bash
    background: false
    confirm: false
    args:
      - -c
      - >-
        flux
        reconcile source oci
        --context $CONTEXT
        -n $NAMESPACE $NAME
        | less -K
  reconcile-ks:
    shortCut: Shift-R
    confirm: false
    description: Flux reconcile
    scopes:
      - kustomizations
    command: bash
    background: false
    args:
      - -c
      - >-
        flux
        reconcile kustomization
        --context $CONTEXT
        -n $NAMESPACE $NAME
        | less -K
  reconcile-ir:
    shortCut: Shift-R
    confirm: false
    description: Flux reconcile
    scopes:
      - imagerepositories
    command: sh
    background: false
    args:
      - -c
      - >-
        flux
        reconcile image repository
        --context $CONTEXT
        -n $NAMESPACE $NAME
        | less -K
  reconcile-iua:
    shortCut: Shift-R
    confirm: false
    description: Flux reconcile
    scopes:
      - imageupdateautomations
    command: sh
    background: false
    args:
      - -c
      - >-
        flux
        reconcile image update
        --context $CONTEXT
        -n $NAMESPACE $NAME
        | less -K
  toggle-rset:
    shortCut: Shift-T
    confirm: false
    scopes:
      - resourcesets
    description: Toggle to suspend or resume a ResourceSet
    command: bash
    background: false
    args:
      - -c
      - >-
        reconcile=$(kubectl --context $CONTEXT get resourceset -n $NAMESPACE $NAME -o=custom-columns='TYPE:.metadata.annotations.fluxcd\.controlplane\.io/reconcile' | tail -1);
        verb=$([ $reconcile = "disabled" ] && echo "resume" || echo "suspend");
        flux-operator
        $verb rset
        --kube-context $CONTEXT
        -n $NAMESPACE $NAME
        | less -K
  toggle-inputprovider:
    shortCut: Shift-T
    confirm: false
    scopes:
      - resourcesetinputprovider
    description: Toggle to suspend or resume an InputProvider
    command: bash
    background: false
    args:
      - -c
      - >-
        reconcile=$(kubectl --context $CONTEXT get resourcesetinputprovider -n $NAMESPACE $NAME -o=custom-columns='TYPE:.metadata.annotations.fluxcd\.controlplane\.io/reconcile' | tail -1);
        verb=$([ $reconcile = "disabled" ] && echo "resume" || echo "suspend");
        flux-operator
        $verb inputprovider
        --kube-context $CONTEXT
        -n $NAMESPACE $NAME
        | less -K
  reconcile-rset:
    shortCut: Shift-R
    confirm: false
    description: Flux reconcile
    scopes:
      - resourcesets
    command: bash
    background: false
    args:
      - -c
      - >-
        flux-operator
        reconcile rset
        --kube-context $CONTEXT
        -n $NAMESPACE $NAME
        | less -K
  reconcile-inputprovider:
    shortCut: Shift-R
    confirm: false
    description: Flux reconcile
    scopes:
      - resources
    command: bash
    background: false
    args:
      - -c
      - >-
        flux-operator
        reconcile inputprovider
        --kube-context $CONTEXT
        -n $NAMESPACE $NAME
        | less -K
  reconcile-fluxinstance:
    shortCut: Shift-R
    confirm: false
    description: Flux reconcile
    scopes:
      - fluxinstances
    command: bash
    background: false
    args:
      - -c
      - >-
        flux-operator
        reconcile instance
        --kube-context $CONTEXT
        -n $NAMESPACE $NAME
        | less -K
  toggle-fluxinstance:
    shortCut: Shift-T
    confirm: false
    scopes:
      - fluxinstances
    description: Toggle to suspend or resume a FluxInstance
    command: bash
    background: false
    args:
      - -c
      - >-
        reconcile=$(kubectl --context $CONTEXT get fluxinstance -n $NAMESPACE $NAME -o=custom-columns='TYPE:.metadata.annotations.fluxcd\.controlplane\.io/reconcile' | tail -1);
        verb=$([ $reconcile = "disabled" ] && echo "resume" || echo "suspend");
        flux-operator
        $verb instance
        --kube-context $CONTEXT
        -n $NAMESPACE $NAME
        | less -K
  trace:
    shortCut: Shift-F
    confirm: false
    description: Flux trace
    scopes:
      - all
    command: bash
    background: false
    args:
      - -c
      - >-
        if [ -n "$RESOURCE_GROUP" ]; then api_endpoint="/apis/$RESOURCE_GROUP/$RESOURCE_VERSION"; else api_endpoint="/api/$RESOURCE_VERSION"; fi;
        api_resource=$(kubectl get --raw "${api_endpoint}" | jq -r ".resources[] | select(.name==\"$RESOURCE_NAME\")");
        kind=$(echo ${api_resource} | jq -r '.kind');
        namespace_arg=$(echo ${api_resource} | jq -r "if .namespaced == true then \"--namespace $NAMESPACE\" else \"\" end");
        [ -n "$RESOURCE_GROUP" ] && api_version=$RESOURCE_GROUP/;
        api_version=${api_version}$RESOURCE_VERSION;
        flux
        trace
        --context $CONTEXT
        --kind ${kind}
        --api-version ${api_version}
        ${namespace_arg}
        $NAME
        |& less -K
  # credits: https://github.com/fluxcd/flux2/discussions/2494
  get-suspended-helmreleases:
    shortCut: Shift-S
    confirm: false
    description: Suspended Helm Releases
    scopes:
      - helmrelease
    command: sh
    background: false
    args:
      - -c
      - >-
        kubectl get
        --context $CONTEXT
        --all-namespaces
        helmreleases.helm.toolkit.fluxcd.io -o json
        | jq -r '.items[] | select(.spec.suspend==true) | [.metadata.namespace,.metadata.name,.spec.suspend] | @tsv'
        | less -K
  get-suspended-kustomizations:
    shortCut: Shift-S
    confirm: false
    description: Suspended Kustomizations
    scopes:
      - kustomizations
    command: sh
    background: false
    args:
      - -c
      - >-
        kubectl get
        --context $CONTEXT
        --all-namespaces
        kustomizations.kustomize.toolkit.fluxcd.io -o json
        | jq -r '.items[] | select(.spec.suspend==true) | [.metadata.name,.spec.suspend] | @tsv'
        | less -K
