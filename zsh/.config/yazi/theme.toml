# yazi visual theme via the official Catppuccin Mocha flavor.
# Installed with `ya pkg add yazi-rs/flavors:catppuccin-mocha` (tracked in
# package.toml + flavors/); upgrade with `ya pkg upgrade`. This replaces the
# hand-maintained 50 KB theme that targeted a Sep-2024 yazi schema and no longer
# parsed (renamed sections, url/mime rules, removed fields).
[flavor]
dark = "catppuccin-mocha"
